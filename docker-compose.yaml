services:

  frontend:
    build:
      context: .
      dockerfile: sample-frontend/Dockerfile
      args:
        VITE_GRAPHQL_ENDPOINT: http://localhost:8082/graphql
        VITE_BFF_BASIC_AUTH_USERNAME: sample_user
        VITE_BFF_BASIC_AUTH_PASSWORD: sample_password
    ports:
      - "3000:80"
    depends_on:
      - bff

  app:
    build:
      context: .
      dockerfile: sample-backend/Dockerfile
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sample_backend
      SPRING_DATASOURCE_USERNAME: sample_user
      SPRING_DATASOURCE_PASSWORD: sample_password
    depends_on:
      - postgres

  bff:
    build:
      context: .
      dockerfile: sample-bff/Dockerfile
    ports:
      - "8082:8082"
    environment:
      BACKEND_BASE_URL: http://app:8080
      BFF_SECURITY_USER_NAME: sample_user
      BFF_SECURITY_USER_PASSWORD: sample_password
    depends_on:
      - app

  batch:
    build:
      context: .
      dockerfile: sample-batch/Dockerfile
    profiles:
      - batch
    environment:
      BACKEND_BASE_URL: http://app:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sample_batch
      SPRING_DATASOURCE_USERNAME: sample_user
      SPRING_DATASOURCE_PASSWORD: sample_password
      SFTP_HOST: sftp
      SFTP_PORT: 22
      SFTP_USERNAME: sample_user
      SFTP_PASSWORD: sample_password
      SFTP_REMOTE_DIRECTORY: /upload
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: sample_user
      RABBITMQ_PASSWORD: sample_password
      REPORT_QUEUE_NAME: user-name-list-report.request
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      - app
      - postgres
      - sftp
      - rabbitmq
    volumes:
      - ./sample-batch/work/output:/app/work/output

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sample_backend
      POSTGRES_USER: sample_user
      POSTGRES_PASSWORD: sample_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  sftp:
    image: atmoz/sftp:latest
    ports:
      - "2222:22"
    command: sample_user:sample_password:1001
    volumes:
      - ./docker/sftp/upload:/home/sample_user/upload

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sample_user
      RABBITMQ_DEFAULT_PASS: sample_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  rabbitmq-data: