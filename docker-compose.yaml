services:
  app:
    build:
      context: .
      dockerfile: sample-backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sample_backend
      SPRING_DATASOURCE_USERNAME: sample_user
      SPRING_DATASOURCE_PASSWORD: sample_password
    depends_on:
      - postgres

  batch:
    build:
      context: .
      dockerfile: sample-batch/Dockerfile
    profiles:
      - batch
    environment:
      BACKEND_BASE_URL: http://app:8080
      SFTP_HOST: sftp
      SFTP_PORT: 22
      SFTP_USERNAME: sample_user
      SFTP_PASSWORD: sample_password
      SFTP_REMOTE_DIRECTORY: /upload
    depends_on:
      - app
      - sftp
    volumes:
      - ./sample-batch/work/output:/app/work/output

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sample_backend
      POSTGRES_USER: sample_user
      POSTGRES_PASSWORD: sample_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  sftp:
    image: atmoz/sftp:latest
    ports:
      - "2222:22"
    command: sample_user:sample_password:1001
    volumes:
      - ./docker/sftp/upload:/home/sample_user/upload